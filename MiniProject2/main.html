<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniProject | To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>To-Do List dengan Filter</h1>
    </header>
    <main>
        <section class="container">
            <form action="" id="todo-form">
                <input type="text" id="todo-input" placeholder="Tambahkan Tugas" required>
                <button type="submit">Tambah</button>
            </form>

            <input type="text" id="filter-input" placeholder="Filter Tugas...">

            <ul id="todo-list"></ul>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
